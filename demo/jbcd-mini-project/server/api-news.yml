spring:
  application:
    name: api-news
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      schema: ${APP_DATABASE_SCHEMA}
  flyway:
    enabled: true
    schemas: ${APP_DATABASE_SCHEMA}
    default-schema: ${APP_DATABASE_SCHEMA}
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true
    postgresql:
      transactional-lock: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  cache:
    type: redis
    redis:
      cache-null-values: false
      time-to-live: 5m

client:
  captcha:
    base-url: ${CAPTCHA_BASE_URL}

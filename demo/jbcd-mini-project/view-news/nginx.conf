server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: /news/:id, /create и любые внутренние маршруты
    # возвращаются клиенту как index.html, а дальше Vue Router сам разбирается.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статика SPA — ок кешировать агрессивно, index.html — нет.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}

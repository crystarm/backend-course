spring:
  application:
    name: jbcd-4c-spring-boot-data-jdbc
  web:
    error:
      include-stacktrace: never
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/lectures_java_course_demo
    username: test
    password: test
    hikari:
      schema: jbcd_lesson
  flyway:
    enabled: true
    schemas: jbcd_lesson
    default-schema: jbcd_lesson
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true
    postgresql:
      transactional-lock: false

logging:
  level:
    root: INFO
    com.karandashov: DEBUG
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логин и регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="/css/styles.css" rel="stylesheet"/>
    <script src="/js/auth.js" type="module"></script>
</head>
<body class="min-h-screen bg-base-200">
<div class="mx-auto flex min-h-screen max-w-5xl flex-col gap-6 px-4 py-8">
    <div class="flex items-center justify-between">
        <div>
            <p class="text-sm uppercase tracking-[0.3em] text-primary">OIDC Demo</p>
            <h1 class="text-4xl font-black">Вход через Dex</h1>
        </div>
        <a class="btn btn-outline" href="/">К новостям</a>
    </div>

    <div id="page-alert"></div>

    <section class="grid gap-6 lg:grid-cols-[1.15fr_0.85fr]">
        <article class="card bg-base-100 shadow-sm">
            <div class="card-body">
                <h2 class="card-title">Логин через OIDC</h2>
                <p class="text-sm text-base-content/70">
                    Браузер уйдет на Dex, получит `code`, обменяет его на токены и будет обновлять их через refresh token.
                </p>
                <button id="login-button" class="btn btn-primary w-full sm:w-auto" type="button">Войти через Dex</button>
            </div>
        </article>

        <article class="card bg-base-100 shadow-sm">
            <div class="card-body">
                <h2 class="card-title">Тестовый пользователь</h2>
                <p class="text-sm text-base-content/70">Пользователь берется из локального Dex-конфига.</p>
                <div class="mockup-code text-sm">
                    <pre data-prefix="$"><code>email: student@example.com</code></pre>
                    <pre data-prefix="$"><code>password: password</code></pre>
                </div>
            </div>
        </article>
    </section>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const AuthApi = window.AuthApi;
        const loginButton = document.getElementById("login-button");

        try {
            const callbackProcessed = await AuthApi.handleLoginCallbackIfNeeded();
            if (callbackProcessed) {
                return;
            }
        } catch (error) {
            AuthApi.showAlert("page-alert", "alert-error", "Не удалось завершить OIDC-логин");
            return;
        }

        loginButton.addEventListener("click", async () => {
            try {
                await AuthApi.login();
            } catch (error) {
                AuthApi.showAlert("page-alert", "alert-error", "Не удалось начать OIDC-логин");
            }
        });
    });
</script>
</body>
</html>

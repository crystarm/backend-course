spring:
  application:
    name: jbcd-7a-sso-jwt-to-session-auth
  web:
    error:
      include-stacktrace: never
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/lectures_java_course_demo
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: jbcd_lesson
    show_sql: true
    open-in-view: false
  flyway:
    enabled: true
    schemas: jbcd_lesson
    default-schema: jbcd_lesson
  data:
    redis:
      host: localhost
      port: 6379
  security:
    cors:
      allowed-origins: http://localhost:8080
    oauth2:
      client:
        provider:
          dex:
            issuer-uri: http://localhost:5556/dex
        registration:
          dex:
            client-id: jbcd-sso-session-client
            client-secret: jbcd-sso-session-secret
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            provider: dex
            scope:
              - openid
              - profile
              - email

logging:
  level:
    root: INFO
    com.karandashov: DEBUG

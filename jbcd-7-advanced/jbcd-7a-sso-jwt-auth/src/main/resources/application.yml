spring:
  application:
    name: jbcd-7a-sso-jwt-auth
  web:
    error:
      include-stacktrace: never
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: ${APP_DATABASE_SCHEMA}
    show_sql: true
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml
    default-schema: ${spring.jpa.properties.hibernate.default_schema}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${app.security.oidc.issuer-uri}

app:
  security:
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI}
      client-id: ${OIDC_CLIENT_ID}
      frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:8080}
      scope: openid profile email offline_access
      access-token-expiring-notification-seconds: 15

logging:
  level:
    root: INFO
    com.karandashov: DEBUG

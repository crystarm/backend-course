spring:
  application:
    name: jbcd-7a-sso-jwt-auth
  web:
    error:
      include-stacktrace: never
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/lectures_java_course_demo
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: jbcd_lesson
    show_sql: true
    open-in-view: false
  flyway:
    enabled: true
    schemas: jbcd_lesson
    default-schema: jbcd_lesson
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true
    postgresql:
      transactional-lock: false
  security:
    cors:
      allowed-origins: http://localhost:8080,http://localhost:5556
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${app.security.oidc.issuer-uri}

app:
  security:
    oidc:
      issuer-uri: http://localhost:5556/dex
      client-id: jbcd-jwt-frontend
      frontend-base-url: http://localhost:8080
      scope: openid profile email offline_access
      access-token-expiring-notification-seconds: 15

logging:
  level:
    root: INFO
    com.karandashov: DEBUG

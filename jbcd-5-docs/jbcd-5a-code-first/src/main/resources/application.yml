spring:
  application:
    name: jbcd-4c-spring-boot-jpa-hibernate
  web:
    error:
      include-stacktrace: never
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: ${APP_DATABASE_SCHEMA}
    show_sql: true
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml
    default-schema: ${spring.jpa.properties.hibernate.default_schema}

logging:
  level:
    root: INFO
    com.karandashov: DEBUG

springdoc:
  api-docs:
    enabled: true      # Всегда выключайте в ПРОД! Я включил только ради показа на занятиях
    path: /api-docs
  swagger-ui:
    enabled: true      # Всегда выключайте в ПРОД!
    path: /swagger-ui
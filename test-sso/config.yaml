issuer: http://localhost:5556/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556
  allowedOrigins:
    - http://localhost:8080
  allowedHeaders:
    - Content-Type
    - Authorization

oauth2:
  skipApprovalScreen: true

expiry:
  idTokens: 2m
  authRequests: 5m
  signingKeys: 6h
  refreshTokens:
    validIfNotUsedFor: 24h
    absoluteLifetime: 168h
    reuseInterval: 3s

enablePasswordDB: true

staticClients:
  - id: jbcd-jwt-frontend
    public: true
    name: JBCD JWT Frontend
    redirectURIs:
      - http://localhost:8080/login.html
  - id: jbcd-sso-session-client
    secret: jbcd-sso-session-secret
    name: JBCD SSO Session Client
    redirectURIs:
      - http://localhost:8080/login/oauth2/code/dex

# Тестовый пользователь: student@example.com / password
staticPasswords:

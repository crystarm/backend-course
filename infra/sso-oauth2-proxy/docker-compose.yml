# Не забываем запустить сам sso и redis, чтобы эта штука работала

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.2
    restart: no
    ports:
      - "4180:4180"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./oauth2-proxy.toml:/etc/oauth2-proxy/oauth2-proxy.toml:ro
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.toml

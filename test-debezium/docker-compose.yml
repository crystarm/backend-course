volumes:
  kafka_data:
  postgres_data:

services:

  postgres:
    image: postgres:18
    container_name: postgres
    restart: no
    environment:
      POSTGRES_DB: lectures_java_course_demo
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    command: # требуется дополнительно сконфигурировать WAL
      [
        "postgres",
        "-c", "wal_level=logical",
        "-c", "log_statement=all",
        "-c", "max_wal_senders=10",
        "-c", "max_replication_slots=10"
      ]
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init-db.sql # обратите внимание на добавление роли в init.sql
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d lectures_java_course_demo" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  app:
    build: ./../jbcd-6-tools/jbcd-6b-kafka-transactional-outbox
    container_name: app
    restart: no
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file:
      - .env
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/news >/dev/null 2>&1 || exit 1"]
      interval: 10s
      retries: 12
      start_period: 40s
      timeout: 5s

  kafka: # Это минимальный вариант kafka
    image: confluentinc/cp-kafka:7.7.7
    container_name: kafka
    restart: no
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      CLUSTER_ID: MkU3OThGNTcwNTJENDM2Qg
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: 'INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,EXTERNAL://localhost:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_MS: 604800000
      KAFKA_LOG_RETENTION_BYTES: 10737418240
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    restart: no
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "9090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: TestCluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
      SERVER_SERVLET_CONTEXT_PATH: /
      
  connect: # сам сервис debezium connect, который подключится к WAL Postgres и будет отправлять сообщения в kafka
    image: quay.io/debezium/connect:3.3.0.Final
    container_name: connect
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8083:8083" # порт для управления и регистрации правил (см ниже)
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      # вспомогательные топики debezium
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      ENABLE_DEBEZIUM_SCRIPTING: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors || exit 1"]
      interval: 10s
      retries: 20
      timeout: 5s

  # Просто поднять debezium connect недостаточно.
  # Нужно зарегистрировать коннектор, который будет слушать изменения в таблице outbox.
  # Сделаем это с помощью POST запроса с помощью curl.
  register-outbox-connector:
    image: curlimages/curl:8.18.0
    container_name: register-outbox-connector
    depends_on:
      connect:
        condition: service_healthy
    volumes:
      # загляни в эти файлы, чтобы понять конфигурацию
      - ./register-connector.sh:/register-connector.sh:ro
      - ./producer.json:/producer.json:ro
    entrypoint: ["sh", "/register-connector.sh"]

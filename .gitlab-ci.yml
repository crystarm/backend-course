stages:
  - build
  - publish

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  TESTCONTAINERS_HOST_OVERRIDE: docker

# CI делает полную Maven-сборку репозитория.
# Docker daemon нужен Java-тестам на Testcontainers.
# При создании git tag собранные jar передаются во второй stage, где buildx собирает
# multi-arch образы для linux/amd64 и linux/arm64 и публикует их в GitLab Registry:
# https://gitlab.com/VladKarandashov/java-backend-course-demo/container_registry

.docker-in-docker:
  services:
    - name: docker:27.4.1-dind
      command:
        - --tls=false

build-project:
  stage: build
  extends: .docker-in-docker
  image: maven:3.9-eclipse-temurin-25-alpine
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
    MAVEN_CLI_OPTS: "--batch-mode --show-version --fail-at-end"
  cache:
    key: "maven-${CI_PROJECT_ID}"
    paths:
      - .m2/repository/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
  before_script:
    - apk add --no-cache docker-cli fontconfig ttf-dejavu
    - docker info
  script:
    - mvn ${MAVEN_CLI_OPTS} clean install
  artifacts:
    expire_in: 1 week
    paths:
      - jbcd-mini-project/api-news/target/api-news-*.jar
      - jbcd-mini-project/api-captcha/target/api-captcha-*.jar

publish-images:
  stage: publish
  extends: .docker-in-docker
  image: docker:27.4.1
  needs:
    - job: build-project
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --name mini-project-builder --driver docker-container --use || docker buildx use mini-project-builder
    - docker buildx inspect --bootstrap
  script:
    - |
      build_and_push() {
        CONTEXT="$1"
        DOCKERFILE="$2"
        IMAGE_NAME="$3"
        IMAGE_TAG="${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${CI_COMMIT_TAG}"
        IMAGE_LATEST="${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:latest"

        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -f "${DOCKERFILE}" \
          -t "${IMAGE_TAG}" \
          -t "${IMAGE_LATEST}" \
          --push \
          "${CONTEXT}"
      }
    - build_and_push "${CI_PROJECT_DIR}/jbcd-mini-project/view-news" "${CI_PROJECT_DIR}/jbcd-mini-project/view-news/Dockerfile" "view-news"
    - build_and_push "${CI_PROJECT_DIR}/jbcd-mini-project/api-news" "${CI_PROJECT_DIR}/jbcd-mini-project/api-news/Dockerfile" "api-news"
    - build_and_push "${CI_PROJECT_DIR}/jbcd-mini-project/api-captcha" "${CI_PROJECT_DIR}/jbcd-mini-project/api-captcha/Dockerfile" "api-captcha"

# Основные директории (Garage их использует для хранения)
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"

# База данных (lmdb — самый быстрый движок для single-node)
db_engine = "lmdb"

# Репликация (для single-node ставим 1; в кластере — 3)
replication_factor = 1

# Сжатие объектов (0=выкл, 2=баланс скорость/размер)
compression_level = 2

# RPC-настройки (обязательно для single-node, даже если одна нода)
rpc_bind_addr    = "0.0.0.0:3901"          # слушаем на всех интерфейсах
rpc_public_addr  = "127.0.0.1:3901"        # как нода видна самой себе (в bridge-сети)
rpc_secret = "8df82c831b55f2ba26c83265c8c3b1f06468f4898f0342d29fcf71af88cea73b"  # Генерируйте: openssl rand -hex 32. Один на все ноды!

# S3 API секция (здесь подключаются клиенты: aws cli, rclone и т.д.)
[s3_api]
s3_region = "garage"                      # Регион для S3-совместимости (любой, но одинаковый)
api_bind_addr = "0.0.0.0:3900"            # Порт S3 API (endpoint: http://localhost:3900)
root_domain = ".s3.garage"                # Суффикс для доменов бакетов (опционально)

# Встроенный web-интерфейс (для показа статического контента)
[s3_web]
bind_addr = "0.0.0.0:3902"                # Порт веб-UI[](http://localhost:3902)
root_domain = ".web.garage"               # Суффикс для web-доступа
index = "index.html"                      # Индексный файл для bucket
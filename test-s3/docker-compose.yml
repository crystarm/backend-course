version: "3.8"

services:
  seaweed:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed
    command: >
      server -s3
      -dir=/data
      -ip=seaweed
      -s3.port=8333
      -filer.port=8888
      -master.port=9333
      -volume.port=8080
      -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 endpoint ← для сервисов
      - "8888:8888"   # Filer Web UI  (файловая иерархия поверх object storage) ← вот это главное
      - "9333:9333"   # Master Web UI (управление кластером и метаданными томов)
    volumes:
      - ./data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro

  s3ui:
    image: cloudlena/s3manager:latest
    depends_on:
      - seaweed
    environment:
      ENDPOINT: seaweed:8333
      ACCESS_KEY_ID: student
      SECRET_ACCESS_KEY: student123
      USE_SSL: "false"
      SIGNATURE_TYPE: V4
      # опционально:
      ALLOW_DELETE: "true"
      LIST_RECURSIVE: "false"
      PORT: "8080"
    ports:
      - "8080:8080"
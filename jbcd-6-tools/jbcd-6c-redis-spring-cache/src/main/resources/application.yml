#  port: 8082

spring:
  application:
    name: jbcd-4c-spring-boot-jpa-hibernate
  web:
    error:
      include-stacktrace: never
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/lectures_java_course_demo
    username: test
    password: test
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      cache-null-values: false
      time-to-live: 60s
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: jbcd_lesson
    show_sql: true
    open-in-view: false
  flyway:
    enabled: true
    schemas: jbcd_lesson
    default-schema: jbcd_lesson
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true
    postgresql:
      transactional-lock: false

logging:
  level:
    root: INFO
    com.karandashov: DEBUG
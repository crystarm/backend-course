spring:
  application:
    name: api-news
  threads:
    virtual:
      enabled: true
  web:
    error:
      include-stacktrace: never
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/lectures_java_course_demo
    username: test
    password: test
    hikari:
      schema: jbcd_lesson
  flyway:
    enabled: true
    schemas: jbcd_lesson
    default-schema: jbcd_lesson
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      cache-null-values: false
      time-to-live: 5m

client:
  captcha:
    base-url: http://localhost:8082

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.karandashov: DEBUG

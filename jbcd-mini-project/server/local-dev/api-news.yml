spring:
  application:
    name: api-news
  threads:
    virtual:
      enabled: true
  web:
    error:
      include-stacktrace: never
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      schema: ${APP_DATABASE_SCHEMA}
  flyway:
    enabled: true
    schemas: ${APP_DATABASE_SCHEMA}
    default-schema: ${APP_DATABASE_SCHEMA}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  cache:
    type: redis
    redis:
      cache-null-values: false
      time-to-live: 5m

client:
  captcha:
    base-url: ${CAPTCHA_BASE_URL}

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.karandashov: DEBUG

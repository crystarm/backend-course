upstream api_news_upstream {
    server api-news:8080;
}

upstream api_captcha_upstream {
    server api-captcha:8080;
}

upstream view_news_upstream {
    server view-news:80;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /api/news {
        proxy_pass http://api_news_upstream/news;
    }

    location /api/news/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://api_news_upstream;
    }

    location = /api/captcha {
        proxy_pass http://api_captcha_upstream/captcha;
    }

    location /api/captcha/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://api_captcha_upstream;
    }

    location / {
        proxy_pass http://view_news_upstream;
    }
}

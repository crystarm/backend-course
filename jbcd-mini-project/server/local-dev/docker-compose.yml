volumes:
  postgres_data:
  openobserve_data:
  redis_data:

services:
  gateway:
    image: nginx:stable-alpine
    container_name: gateway
    restart: no
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-captcha:
        condition: service_healthy
      api-news:
        condition: service_healthy
      openobserve:
        condition: service_healthy
      view-news:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1" ]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  api-captcha:
    build: ./../../api-captcha
    container_name: api-captcha
    restart: no
    tmpfs:
      - /tmp
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health" ]
      interval: 10s
      retries: 12
      start_period: 40s
      timeout: 5s
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - api-captcha.env
    volumes:
      - ./api-captcha.yml:/application/config/application.yml:ro

  api-news:
    build: ./../../api-news
    container_name: api-news
    restart: no
    tmpfs:
      - /tmp
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health" ]
      interval: 10s
      retries: 12
      start_period: 40s
      timeout: 5s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - api-news.env
    volumes:
      - ./api-news.yml:/application/config/application.yml:ro

  view-news:
    build: ./../../view-news
    container_name: view-news
    restart: no
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1" ]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  postgres:
    image: postgres:18
    container_name: postgres
    restart: no
    environment:
      POSTGRES_DB: news_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    command: [ "postgres", "-c", "log_statement=all" ]
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init-db.sql
      - postgres_data:/var/lib/postgresql
    entrypoint: [ "bash", "-c", "docker-entrypoint.sh postgres" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test -d news_db" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  redis:
    image: redis:8.6.0
    container_name: redis
    restart: no
    command:
      - redis-server
      - --save 60 1
      - --appendonly yes
      - --appendfsync everysec
      - --maxmemory 512mb
      - --maxmemory-policy volatile-ttl
      - --maxmemory-samples 5
      - --port 6379
      - --bind 0.0.0.0
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    restart: no
    environment:
      ZO_ROOT_USER_EMAIL: root@example.com
      ZO_ROOT_USER_PASSWORD: rootpass123
      ZO_DATA_DIR: /data
    ports:
      - "5080:5080"
    volumes:
      - openobserve_data:/data
    healthcheck:
      test: [ "CMD", "/openobserve", "node", "status" ]
      interval: 10s
      retries: 20
      start_period: 30s
      timeout: 5s

  vector:
    image: timberio/vector:0.43.1-alpine
    container_name: vector
    restart: no
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./vector.yaml:/etc/vector/vector.yaml:ro
    command: [ "--config", "/etc/vector/vector.yaml" ]
    depends_on:
      api-captcha:
        condition: service_healthy
      api-news:
        condition: service_healthy
      openobserve:
        condition: service_healthy

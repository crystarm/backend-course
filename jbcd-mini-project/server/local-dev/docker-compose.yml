volumes:
  postgres_data:
  victoria_metrics_data:
  victoria_logs_data:
  victoria_traces_data:
  grafana_data:
  redis_data:

services:
  gateway:
    image: nginx:stable-alpine
    container_name: gateway
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-captcha:
        condition: service_healthy
      api-news:
        condition: service_healthy
      view-news:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1" ]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  api-captcha:
    build: ./../../api-captcha
    container_name: api-captcha
    restart: always
    tmpfs:
      - /tmp
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health" ]
      interval: 10s
      retries: 12
      start_period: 40s
      timeout: 5s
    depends_on:
      redis:
        condition: service_healthy
      victoria-traces:
        condition: service_started
    env_file:
      - api-captcha.env
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/application/config/application.yml,optional:file:/application/config/api-captcha.yml
    volumes:
      - ./../application.yml:/application/config/application.yml:ro
      - ./../api-captcha.yml:/application/config/api-captcha.yml:ro

  api-news:
    build: ./../../api-news
    container_name: api-news
    restart: always
    tmpfs:
      - /tmp
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health" ]
      interval: 10s
      retries: 12
      start_period: 40s
      timeout: 5s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      victoria-traces:
        condition: service_started
    env_file:
      - api-news.env
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/application/config/application.yml,optional:file:/application/config/api-news.yml
    volumes:
      - ./../application.yml:/application/config/application.yml:ro
      - ./../api-news.yml:/application/config/api-news.yml:ro

  view-news:
    build: ./../../view-news
    container_name: view-news
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1" ]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  postgres:
    image: postgres:18
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: news_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    command: [ "postgres", "-c", "log_statement=all" ]
    volumes:
      - ./../init.sql:/docker-entrypoint-initdb.d/init-db.sql
      - postgres_data:/var/lib/postgresql
    entrypoint: [ "bash", "-c", "docker-entrypoint.sh postgres" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test -d news_db" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  redis:
    image: redis:8.6.0
    container_name: redis
    restart: always
    command:
      - redis-server
      - --save 60 1
      - --appendonly yes
      - --appendfsync everysec
      - --maxmemory 512mb
      - --maxmemory-policy volatile-ttl
      - --maxmemory-samples 5
      - --port 6379
      - --bind 0.0.0.0
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.144.0
    container_name: victoria-metrics
    restart: always
    command:
      - -storageDataPath=/storage
      - -httpListenAddr=:8428
    ports:
      - "8428:8428"
    volumes:
      - victoria_metrics_data:/storage

  victoria-logs:
    image: victoriametrics/victoria-logs:v1.50.0
    container_name: victoria-logs
    restart: always
    command:
      - -storageDataPath=/storage
      - -httpListenAddr=:9428
    ports:
      - "9428:9428"
    volumes:
      - victoria_logs_data:/storage

  victoria-traces:
    image: victoriametrics/victoria-traces:v0.9.2
    container_name: victoria-traces
    restart: always
    command:
      - -storageDataPath=/storage
      - -httpListenAddr=:10428
    ports:
      - "10428:10428"
    volumes:
      - victoria_traces_data:/storage

  grafana:
    image: grafana/grafana:13.0.2-slim
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./../grafana/provisioning:/etc/grafana/provisioning:ro
      - ./../grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      victoria-metrics:
        condition: service_started
      victoria-logs:
        condition: service_started
      victoria-traces:
        condition: service_started

  vector:
    image: timberio/vector:0.43.1-alpine
    container_name: vector
    restart: always
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./../vector.yaml:/etc/vector/vector.yaml:ro
    command: [ "--config", "/etc/vector/vector.yaml" ]
    depends_on:
      api-captcha:
        condition: service_healthy
      api-news:
        condition: service_healthy
      victoria-metrics:
        condition: service_started
      victoria-logs:
        condition: service_started

api:
  enabled: true
  address: 0.0.0.0:8686

sources:
  app_logs:
    type: docker_logs
    include_containers:
      - app   # имя контейнера из docker-compose

  app_metrics:
    type: prometheus_scrape
    endpoints:
      - http://app:8080/actuator/prometheus
    scrape_interval_secs: 15

transforms:
  app_logs_parsed:
    type: remap
    inputs:
      - app_logs
    source: |
      .service_name = "spring-boot-web-demo"
      .source_type = "docker"

      raw_message = .message
      parsed, err = parse_json(raw_message)

      if err == null {
        parsed_obj, err = object(parsed)

        if err == null {
          . = merge(., parsed_obj)
          .raw_message = raw_message
        }
      }

sinks:
  openobserve_logs:
    type: http
    inputs:
      - app_logs_parsed
    uri: "http://openobserve:5080/api/default/spring-boot-web-demo-logs/_json"
    method: post
    auth:
      strategy: basic
      user: "root@example.com"
      password: "rootpass123"
    compression: gzip
    encoding:
      codec: json
      timestamp_format: rfc3339
    healthcheck:
      enabled: true
      uri: "http://openobserve:5080/healthz"

  openobserve_metrics:
    type: prometheus_remote_write
    inputs:
      - app_metrics
    endpoint: "http://openobserve:5080/api/default/prometheus/api/v1/write"
    auth:
      strategy: basic
      user: "root@example.com"
      password: "rootpass123"
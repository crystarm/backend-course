volumes:
  caddy_data:
  caddy_config:
  caddy_logs:

  postgres_data:
  victoria_metrics_data:
  victoria_logs_data:
  victoria_traces_data:
  grafana_data:
  redis_data:

# Обращаю ваше внимание, что наружу торчит только caddy-gateway.
# Это немного увеличивает безопасность, поскольку не получится напрямую обратиться к внутренним сервисам postgresq/redis
# и позволяет мне оставлять тестовые пароли.
# Также все сервисы запускаются в режиме always, чтобы они автоматически перезапускались в случае падения.

# Еще замечу, что я намеренно занижаю ресурсы у контейнеров, чтобы уместиться на маленький vps. Но это не очень рационально.

services:

  gateway: # caddy автоматически выпустит lets encrypt сертификат на домен, это не сработает локально!
    image: caddy:2.11.2
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # Сеть не указываем — compose положит все сервисы в одну дефолтную сеть,
    # в ней резолвятся имена контейнеров (grafana, api-news и т.д.).
    # Наружу при этом торчит только этот контейнер — через ports.
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 64M

  api-captcha:
    image: registry.gitlab.com/vladkarandashov/java-backend-course-demo/api-captcha
    pull_policy: always
    container_name: api-captcha
    restart: always
    tmpfs:
      - /tmp
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health" ]
      interval: 10s
      retries: 12
      start_period: 40s
      timeout: 5s
    depends_on:
      redis:
        condition: service_healthy
      victoria-traces:
        condition: service_started
    env_file:
      - api-captcha.env
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/application/config/application.yml,optional:file:/application/config/api-captcha.yml
    volumes:
      - ./../application.yml:/application/config/application.yml:ro
      - ./../api-captcha.yml:/application/config/api-captcha.yml:ro
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M

  api-news:
    image: registry.gitlab.com/vladkarandashov/java-backend-course-demo/api-news
    pull_policy: always
    container_name: api-news
    restart: always
    tmpfs:
      - /tmp
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health" ]
      interval: 10s
      retries: 12
      start_period: 40s
      timeout: 5s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      victoria-traces:
        condition: service_started
    env_file:
      - api-news.env
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/application/config/application.yml,optional:file:/application/config/api-news.yml
    volumes:
      - ./../application.yml:/application/config/application.yml:ro
      - ./../api-news.yml:/application/config/api-news.yml:ro
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M

  view-news:
    image: registry.gitlab.com/vladkarandashov/java-backend-course-demo/view-news
    pull_policy: always
    container_name: view-news
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1" ]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 64M

  postgres:
    image: postgres:18
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: news_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    command: [
      "postgres",
      "-c", "log_statement=all",

      "-c", "max_connections=30",
      "-c", "shared_buffers=256MB",
      "-c", "effective_cache_size=768MB",
      "-c", "maintenance_work_mem=64MB",
      "-c", "checkpoint_completion_target=0.9",
      "-c", "wal_buffers=7864kB",
      "-c", "default_statistics_target=100",
      "-c", "random_page_cost=1.1",
      "-c", "effective_io_concurrency=200",
      "-c", "work_mem=8967kB",
      "-c", "huge_pages=off",
      "-c", "min_wal_size=1GB",
      "-c", "max_wal_size=4GB"
    ]
    volumes:
      - ./../init.sql:/docker-entrypoint-initdb.d/init-db.sql
      - postgres_data:/var/lib/postgresql
    entrypoint: [ "bash", "-c", "docker-entrypoint.sh postgres" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test -d news_db" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 1G

  redis:
    image: redis:8.6.0
    container_name: redis
    restart: always
    command:
      - redis-server
      - --save 60 1
      - --appendonly yes
      - --appendfsync everysec
      - --maxmemory 96mb
      - --maxmemory-policy volatile-ttl
      - --maxmemory-samples 5
      - --port 6379
      - --bind 0.0.0.0
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: 1.5
          memory: 128m

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.144.0
    container_name: victoria-metrics
    restart: always
    command:
      - -storageDataPath=/storage
      - -httpListenAddr=:8428
    volumes:
      - victoria_metrics_data:/storage
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512m

  victoria-logs:
    image: victoriametrics/victoria-logs:v1.50.0
    container_name: victoria-logs
    restart: always
    command:
      - -storageDataPath=/storage
      - -httpListenAddr=:9428
    volumes:
      - victoria_logs_data:/storage
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512m

  victoria-traces:
    image: victoriametrics/victoria-traces:v0.9.2
    container_name: victoria-traces
    restart: always
    command:
      - -storageDataPath=/storage
      - -httpListenAddr=:10428
    volumes:
      - victoria_traces_data:/storage
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512m

  grafana:
    image: grafana/grafana:13.0.2-slim
    container_name: grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_ROOT_URL: https://grafana.news.karandashov.com
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./../grafana/provisioning:/etc/grafana/provisioning:ro
      - ./../grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      victoria-metrics:
        condition: service_started
      victoria-logs:
        condition: service_started
      victoria-traces:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 256m

  vector:
    image: timberio/vector:0.43.1-alpine
    container_name: vector
    restart: always
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./../vector.yaml:/etc/vector/vector.yaml:ro
    command: [ "--config", "/etc/vector/vector.yaml" ]
    depends_on:
      api-captcha:
        condition: service_healthy
      api-news:
        condition: service_healthy
      victoria-metrics:
        condition: service_started
      victoria-logs:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 64m

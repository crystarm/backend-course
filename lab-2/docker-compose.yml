services:
  postgres:
    image: postgres:18-alpine
    container_name: lab-2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-game_database}
      POSTGRES_USER: ${DB_USERNAME:-game_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-game_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - game_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  game_postgres_data:
